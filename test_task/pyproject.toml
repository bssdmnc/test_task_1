[project]
name = "task-compliance-harness"
version = "1.0.0"
description = "Authoring-side compliance checks for the php-standard-library PR #740 eval-task bundle"
requires-python = ">=3.10"
dependencies = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers"
